<!doctype html>
<html lang="en" %themeAttrs%>
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
		/>
		<meta name="theme-color" content="#0E0F12" />
		<script>
			// For some reason, Sveltekit doesn't let us load env variables from .env here, so we load it from hooks.server.ts
			window.gaId = "%gaId%";
		</script>
		<!-- %themeAssets%: SSR <link rel="stylesheet"> for an external active theme (Phase 5) -->
		<!-- Pre-paint theme bootstrap; content injected from src/lib/themes/bootstrap.ts.
		     Deliberately NO nonce attribute: the sveltekit nonce placeholder is
		     incompatible with adapter-static's fallback generation (Kit refuses to
		     prerender a template containing it). Revisit when CSP tightens
		     (THEMES.md §9.4). -->
		<script>
			%themeBootstrapScript%
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" class="h-dvh bg-lcars-paper text-lcars-ink antialiased">
		<div id="app" class="contents h-full">%sveltekit.body%</div>

		<!-- Google Tag Manager -->
		<script>
			if (window.gaId) {
				const script = document.createElement("script");
				script.src = "https://www.googletagmanager.com/gtag/js?id=" + window.gaId;
				script.async = true;
				document.head.appendChild(script);

				window.dataLayer = window.dataLayer || [];
				function gtag() {
					dataLayer.push(arguments);
				}
				gtag("js", new Date());
				/// ^ See https://developers.google.com/tag-platform/gtagjs/install
				gtag("config", window.gaId);
				gtag("consent", "default", { ad_storage: "denied", analytics_storage: "denied" });
				/// ^ See https://developers.google.com/tag-platform/gtagjs/reference#consent
				/// TODO: ask the user for their consent and update this with gtag('consent', 'update')
			}
		</script>
	</body>
</html>
